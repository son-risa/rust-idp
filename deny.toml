# cargo-deny 設定（サプライチェーン: 脆弱性 / ライセンス / 重複 / 出所）。
# ローカル: `cargo deny check`  / CI: .github/workflows/ci.yml の audit ジョブ。

[advisories]
version = 2
# RustSec advisory DB の CVE をすべて検知する。修正版の無いものを除外するときは、理由を書いてここに足す。
ignore = [
    # 暗号化 cookie（PrivateCookieJar。axum-extra の cookie-private）も fork も使わない。直った cookie 0.18.3 は
    # 2026-11-23 16:45 JST 公開で 3 日のクールダウン中。2026-11-26 16:45 JST 以降に上げてここから消す。
    { id = "RUSTSEC-2026-0594", reason = "暗号化 cookie も fork も使わない。cookie 0.18.3 がクールダウンを抜ける 2026-11-26 に上げる" },
]

[bans]
# 同一クレートの複数版（例: getrandom 0.2/0.4）は警告（依存更新で解消を促す。即 fail にはしない）。
multiple-versions = "warn"
wildcards = "warn"

[licenses]
version = 2
confidence-threshold = 0.8
# 許可ライセンス（permissive のみ）。新規依存が想定外ライセンスを持ち込んだら CI で検知する。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[sources]
# 想定外のレジストリ / git 依存はブロック（タイポスクワット・出所不明の混入防止）。
unknown-registry = "deny"
unknown-git = "deny"
