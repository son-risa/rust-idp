# cargo-deny 設定（サプライチェーン: 脆弱性 / ライセンス / 重複 / 出所）。
# ローカル: `cargo deny check`  / CI: .github/workflows/ci.yml の audit ジョブ。

[advisories]
version = 2
# RustSec advisory DB の CVE をすべて検知する。修正版の無いものを除外するときは、理由を書いてここに足す。
ignore = [
    # url 2.5.8 の Url::origin() が入れ子の blob: URL で stack overflow。rust-op も依存先（reqwest, tower-http）も
    # Url::origin() を呼ばない。直った 2.5.9 は 2026-11-20 公開で 7 日のクールダウン中。2026-11-27 以降に上げてここから消す。
    { id = "RUSTSEC-2026-0592", reason = "Url::origin() を呼ばない。url 2.5.9 がクールダウンを抜ける 2026-11-27 に上げる" },
]

[bans]
# 同一クレートの複数版（例: getrandom 0.2/0.4）は警告（依存更新で解消を促す。即 fail にはしない）。
multiple-versions = "warn"
wildcards = "warn"

[licenses]
version = 2
confidence-threshold = 0.8
# 非公開バイナリ（rust-op 自身など license フィールド無しのワークスペースcrate）は対象外。
private = { ignore = true }
# 許可ライセンス（permissive のみ）。新規依存が想定外ライセンスを持ち込んだら CI で検知する。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[sources]
# 想定外のレジストリ / git 依存はブロック（タイポスクワット・出所不明の混入防止）。
unknown-registry = "deny"
unknown-git = "deny"
