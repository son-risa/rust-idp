name: Formal

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "formal/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/formal.yml"
  # PR は paths で絞らない。tamarin と kani は main への merge に必須の検査なので、
  # docs だけの PR でも結果（skipped）を出す必要がある。走らせるかは changes の job で決める。
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAMARIN_VERSION: 1.12.0
  TAMARIN_SHA256: 201be06f469e47cff554df6ca93db8366fc2c69d70c61fcbd1370a1074b469c6
  MAUDE_VERSION: 3.5.1
  MAUDE_SHA256: 72ed1ca87e3b3d0dfc6ee1436baf154bf04c45ff97d521bec040c5e8dfc8f92c
  KANI_VERSION: 0.68.0

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      formal: ${{ steps.files.outputs.formal }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # この job が落ちると後ろの job は skipped（必須の検査として通る）になるので、
          # 一覧を取れないときは落とさずに走らせる側へ倒す。
          if [ "$EVENT" != "pull_request" ]; then echo "formal=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename'); then
            echo "formal=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$files" ] || grep -Eq '^(src/|formal/|Cargo\.toml$|Cargo\.lock$|\.github/workflows/formal\.yml$)' <<<"$files"; then
            echo "formal=true" >> "$GITHUB_OUTPUT"
          else
            echo "formal=false" >> "$GITHUB_OUTPUT"
          fi

  tamarin:
    needs: changes
    if: needs.changes.outputs.formal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # 配布物はリリースの sha256 と照合してから展開する（タグの差し替えでは中身を変えられない）。
      - name: Install Tamarin and Maude
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/dl"
          cd "$RUNNER_TEMP/dl"
          curl -fsSLO "https://github.com/tamarin-prover/tamarin-prover/releases/download/${TAMARIN_VERSION}/tamarin-prover-${TAMARIN_VERSION}-linux64-ubuntu.tar.gz"
          curl -fsSLO "https://github.com/maude-lang/Maude/releases/download/Maude${MAUDE_VERSION}/Maude-${MAUDE_VERSION}-linux-x86_64.zip"
          printf '%s  %s\n' \
            "$TAMARIN_SHA256" "tamarin-prover-${TAMARIN_VERSION}-linux64-ubuntu.tar.gz" \
            "$MAUDE_SHA256" "Maude-${MAUDE_VERSION}-linux-x86_64.zip" | sha256sum -c -
          tar xzf "tamarin-prover-${TAMARIN_VERSION}-linux64-ubuntu.tar.gz" -C "$RUNNER_TEMP/bin"
          unzip -q "Maude-${MAUDE_VERSION}-linux-x86_64.zip" -d "$RUNNER_TEMP/maude"
          chmod +x "$RUNNER_TEMP/maude/maude"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/maude" >> "$GITHUB_PATH"
      - name: Tamarin（expected.tsv と照合）
        run: formal/check.sh

  kani:
    needs: changes
    if: needs.changes.outputs.formal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.100.0 # rust-toolchain.toml と同じ版
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup
      - name: Kani（kani-harnesses.txt と照合）
        run: formal/check-kani.sh
