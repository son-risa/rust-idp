name: Deploy

# main への push でのみ起動する。pull_request では絶対に起動しない
# （公開リポジトリのため、フォークからの PR に WIF 認証情報を渡さないことが重要）。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

env:
  PROJECT_ID: fido2-8b943
  REGION: asia-northeast1
  SERVICE: rust-idp
  RUNTIME_SERVICE_ACCOUNT: rust-op-runtime@fido2-8b943.iam.gserviceaccount.com
  # 非機密の識別子。リポジトリの Settings > Secrets and variables > Actions > Variables で管理。
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  DEPLOY_SERVICE_ACCOUNT: ${{ vars.SERVICE_ACCOUNT_EMAIL }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Test
        run: cargo test --locked

  # 縦切り段階の最小デプロイ: no-traffic候補+手動承認は導入せず直接反映する。
  # 実RPが依存する段階になったら rust-op の deploy.yml と同じ段階的ロールアウト
  # (no-traffic candidate + smoke test + production environment 手動承認) に切り替える。
  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --quiet

      - name: Sync ISSUER env var to the service's own URL
        run: |
          set -euo pipefail
          url=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" --project "$PROJECT_ID" \
            --format="value(status.address.url)")
          gcloud run services update "$SERVICE" \
            --region "$REGION" --project "$PROJECT_ID" \
            --set-env-vars "ISSUER=${url}" \
            --quiet

      - name: Smoke test
        run: |
          set -euo pipefail
          url=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" --project "$PROJECT_ID" \
            --format="value(status.address.url)")
          for path in "/.well-known/openid-configuration" "/.well-known/jwks.json"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${url}${path}")
            if [[ "$code" != "200" ]]; then
              echo "smoke test failed: ${path} -> ${code}"
              exit 1
            fi
            echo "ok: ${path} -> ${code}"
          done
