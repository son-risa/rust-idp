name: CI

on:
  push:
    branches: [main]
  pull_request:

# 公開リポジトリ向けの最小権限: workflow が悪用されても書き込み不可（read-only token）。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # アクションはタグ書き換え攻撃対策でコミット SHA にピン留め（コメントは対応バージョン）。
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.100.0 # rust-toolchain.toml と同じ版
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # gcp 無し（crates.io の既定）と gcp 付き（Cloud Run の本番）の両方を見る。
      - name: Clippy（警告が 1 つでもあれば止める）
        env:
          CARGO_BUILD_WARNINGS: deny
        run: |
          cargo clippy --locked --all-targets
          cargo clippy --locked --all-targets --features gcp
      - name: Test（gcp 無し）
        run: cargo test --locked
      - name: Test（gcp 付き）
        run: cargo test --locked --features gcp
      - name: 前提の台帳の試験が実在するか（cargo test の一覧と照合）
        run: formal/check-ledger-tests.sh

  # サプライチェーン監査: 既知 CVE / ライセンス / 重複 / 出所（deny.toml）。シークレット不使用。
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check advisories bans licenses sources
          rust-version: 1.100.0 # rust-toolchain.toml と同じ版（無いと toolchain file の版が入っていないと言って止まる）
