[package]
name = "rust-idp"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.23.0"
rand = "0.8"
rsa = { version = "0.9.10", features = ["pem", "sha2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
