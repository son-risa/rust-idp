[package]
name = "rust-idp"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "OpenID Provider (FAPI 2.0, passkeys, CIBA, DPoP) as an axum Router, with pluggable storage adapters"
repository = "https://github.com/son-risa/rust-idp"
documentation = "https://docs.rs/rust-idp"
readme = "README.md"
keywords = ["oidc", "openid", "oauth2", "fapi", "webauthn"]
categories = ["authentication", "web-programming::http-server"]
# crates.io へ出すのは library と binary と例、それに表示と義務に要る文書だけ。
# formal/（Tamarin・Kani）、docs/、scripts/、.github/、Dockerfile などは出さない。
# 先頭の / は根に固定するため（無いと gitignore と同じく formal/README.md などにも当たる）。
include = [
    "/src/**/*.rs",
    "/examples/**/*.rs",
    "/README.md",
    "/LICENSE",
    "/CREDITS.md",
    "/THIRD-PARTY-LICENSES.md",
]

[features]
default = []
# Firestore・Cloud KMS・Secret Manager・FCM・Resend へ出る実装と、本番の配線・管理者用サブコマンド。
# Cloud Run の本番の binary はこれを有効にして build する（Dockerfile）。
gcp = []

[[example]]
name = "passkey_memory"
test = true

[dependencies]
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
# Cookie の寿命（max_age）を書くため。axum-extra の cookie が引いているのと同じ版。
time = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
sha2 = { version = "0.11", features = ["oid"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem", "getrandom"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query"] }
# reqwest 0.13 の既定の rustls は aws-lc-rs（C）を引く。純 Rust の ring を使い、main で既定の provider にする。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ciborium = "0.2"
x509-cert = "0.3"
rsa = { version = "0.10", features = ["pkcs1v15"] }
p384 = { version = "0.14", features = ["ecdsa"] }
ed25519-dalek = "3"
sha1 = { version = "0.11", features = ["oid"] }
subtle = "2"

[dev-dependencies]
proptest = "1"
# 差分テスト用の独立 COSE 実装（ピュア Rust, openssl/ring 非依存）。
coset = "0.4"
# router を通しで叩く試験（oneshot）。axum が既に引いている版。
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
# handler の前段は Result<_, Response> で、そのまま応答にして返す（axum の慣習）。箱に入れても読みにくくなるだけ。
result_large_err = "allow"
